name: Feature request
description: Propose a focused improvement to the reconciliation workflow
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What reconciliation task is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example
      description: A synthetic example is especially helpful for matching requests.
