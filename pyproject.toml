[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rowbridge"
version = "0.6.0"
description = "Local-first CSV and Excel reconciliation with explainable matching and human review."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Serhii Drozdov" }]
keywords = ["reconciliation", "csv", "excel", "entity-resolution", "data-quality"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = [
  "fastapi>=0.118,<1",
  "jinja2>=3.1,<4",
  "openpyxl>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "rapidfuzz>=3.14,<4",
  "uvicorn>=0.37,<1",
]

[project.urls]
Repository = "https://github.com/SerDrozd/rowbridge"
Issues = "https://github.com/SerDrozd/rowbridge/issues"

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "mypy>=1.18,<2",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
]

[project.scripts]
rowbridge = "rowbridge.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rowbridge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true
