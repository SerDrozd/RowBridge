<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block title %}RowBridge{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}?v={{ app_version }}">
  <script src="{{ url_for('static', path='/app.js') }}?v={{ app_version }}" defer></script>
</head>
<body>
  <header class="app-header">
    <div class="app-bar">
      <a class="brand" href="/" aria-label="RowBridge home">
        <span class="brand-mark" aria-hidden="true">RB</span>
        <span class="brand-copy"><strong>RowBridge</strong><small>Data reconciliation</small></span>
      </a>
      <nav class="app-nav" aria-label="Application">
        <a href="/">New reconciliation</a>
        <a href="/runs">Runs</a>
        <span class="local-state"><i aria-hidden="true"></i>Runs locally</span>
      </nav>
    </div>
  </header>
  <main class="app-main">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
